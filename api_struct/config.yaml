project:
  description: '浙江人形机器人 Navi 系列 ROS1 API'
  version: "v1.5.0"

# 功能模块列表
modules:
  - audio
  - chassis
  - hand
  - lowerlimb
  - manipulation
  - navigation
  - perception
  - robot
  - sensor
    - CAM_A
    - CAM_B
    - CAM_C
    - CAM_D
    - head_imu
    - realsense_down
    - realsense_up
    - realsense_head
  - upperlimb

# 机器人型号及其对应的功能模块排除列表
robot_models:
  U1:
    exclude_modules:
      - navigation
      - perception
      - lowerlimb
      - sensor/realsense_down
      - sensor/realsense_head

  I2:
    exclude_modules:
      - manipulation
      - sensor/realsense_head
      - upperlimb/movej/lifting
      - upperlimb/go_home/lifting
      - upperlimb/speedj/lifting
      - upperlimb/servoj/lifting
      - upperlimb/movej_by_path/lifting
      - hand/task_switch
      - hand/wrist_force_sensor
      - navigation/version
      - upperlimb/speedj/whole_body
      - chassis
      - audio/microphone/wake_data
      - audio/microphone/wake_info


  WA1:
    exclude_modules:
      - lowerlimb
      - sensor/CAM_A
      - sensor/CAM_B
      - sensor/CAM_C
      - sensor/CAM_D
      - sensor/head_imu
      - sensor/realsense_down
      - manipulation
      - hand/task_switch
      - hand/wrist_force_sensor
      - navigation/version
      - upperlimb/speedj/whole_body
      - audio/microphone/wake_data
      - audio/microphone/wake_info

  WA2:
    exclude_modules:
      - manipulation
      - lowerlimb
      - sensor/CAM_A
      - sensor/CAM_B
      - sensor/CAM_C
      - sensor/CAM_D
      - sensor/head_imu
      # - sensor/realsense_up
      - sensor/realsense_down
      - upperlimb/movej/lifting
      - upperlimb/go_home/lifting
      - upperlimb/movej_by_path/lifting
      - upperlimb/movej_by_pose
      - upperlimb/speedj/lifting
      - hand/task_switch
      - hand/wrist_force_sensor
      - upperlimb/speedj/whole_body
      - audio/microphone/wake_data
      - audio/microphone/wake_info
      - upperlimb/enable_speedl
      - upperlimb/is_singular
      - upperlimb/servoj/lifting
      - upperlimb/speedl
